services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: face-temphora:latest
    container_name: face-temphora-app
    restart: unless-stopped
    ports:
      - "5011:8080"
    env_file:
      - .env
    environment:
      # Override do .env: dentro do compose o host é o nome do service.
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      PORT: 8080
      LOG_LEVEL: INFO
      # Habilita log em arquivo dentro de /tmp (writable). Comente em prod.
      LOG_FILE: /tmp/system.log
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: face-temphora-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-temphora}
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -uroot
        - -p${MYSQL_PASSWORD:-root123}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql-data:
